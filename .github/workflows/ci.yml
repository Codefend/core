name: CI
run-name: CI Workflow

on: [pull_request]

permissions:
    contents: read

jobs:
    audit:
        name: 🛡️ Audit
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: npm
            - name: 🛡️ Audit
              run: npm audit --audit-level=high

    format:
        name: 🔬 Format
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: npm
            - run: npm ci
            - name: 🔬 Format
              run: npm run format:check

    lint:
        name: ⬣ ESLint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: npm
            - run: npm ci
            - name: ⬣ ESLint
              run: npm run lint:check

    spell:
        name: 🈸 Spellcheck
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: npm
            - run: npm ci
            - name: 🈸 Spellcheck
              run: npm run spell:check

    type:
        name: ʦ Typecheck
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: npm
            - run: npm ci
            - name: ʦ Typecheck
              run: npm run type:check

    test:
        name: ⚡ Tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: npm
            - run: npm ci
            - name: ⚡ Tests
              run: npm run test:run
            - name: Coverage
              run: npm run test:coverage

    build:
        name: 🚀 Build
        needs: [audit, format, lint, spell, type, test]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: npm
            - run: npm ci
            - name: 🔨 Build
              run: npm run build
            - name: Package contracts
              run: npm run test:package

    runtime:
        name: Node.js ${{ matrix.node }} runtime
        needs: build
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node: ["18.0.0", "20", "22", "24", "26"]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: npm
            - run: npm ci
            - run: npm run build
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node }}
            - name: Package runtime contracts
              run: npm run test:package
